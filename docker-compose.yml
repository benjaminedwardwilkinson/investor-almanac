services:
  stock-almanac:
    build: .
    container_name: stock-almanac
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      DATA_DIR: /data
      PORT: 8080
      SEC_CONTACT_EMAIL: ${SEC_CONTACT_EMAIL:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
    volumes:
      - stock-almanac-data:/data

volumes:
  stock-almanac-data:
